name: Build OrangeFox Recovery for OP4C7D

on:
  push:
    branches:
      - fox_12.1

  workflow_dispatch:

jobs:
  build-recovery:
    runs-on: ubuntu-24.04

    env:
      BRANCH: twrp-12.1
      DEVICE_CODENAME: OP4C7D
      OUT_DIR: out/ofox

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Aggressive Disk Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/google
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/jvm

          sudo docker system prune -af || true
          sudo apt clean || true

          df -h

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            curl \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            gperf \
            imagemagick \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            openjdk-11-jdk \
            wget \
            python3 \
            python-is-python3

          sudo update-alternatives --set java \
            /usr/lib/jvm/java-11-openjdk-amd64/bin/java

          sudo update-alternatives --set javac \
            /usr/lib/jvm/java-11-openjdk-amd64/bin/javac

      - name: Install ncurses5 compatibility libraries
        run: |
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb

          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo dpkg -i libncurses5_6.3-2ubuntu0.1_amd64.deb

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global gc.auto 0

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin

          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo

          chmod a+x ~/bin/repo

          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Clone OrangeFox sync repo
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git

      - name: Run OrangeFox sync script
        run: |
          cd sync
          
          chmod +x orangefox_sync.sh
          
          ./orangefox_sync.sh \
            --branch 12.1 \
            --path $GITHUB_WORKSPACE/android

      - name: Create Local Manifest
        run: |
          cd android

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/roomservice.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

              <project
                  name="${{ github.repository }}"
                  path="device/oppo/OP4C7D"
                  remote="github"
                  revision="fox_12.1" />

          </manifest>
          EOF

      - name: Setup CCache
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)

          ccache -M 5G
          ccache -o compression=true
          
      - name: Build Recovery Image
        shell: bash
        run: |
          cd android

          export OUT_DIR=out/ofox
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)

          source build/envsetup.sh

          lunch twrp_OP4C7D-eng

          mka adbd recoveryimage

      - name: Verify Output
        run: |
          cd android

          ls -lh \
            out/ofox/target/product/${DEVICE_CODENAME}/

          test -f \
            out/ofox/target/product/${DEVICE_CODENAME}/recovery.img

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recoveryimage-${{ env.DEVICE_CODENAME }}
          path: |
            android/out/ofox/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
            android/out/ofox/target/product/${{ env.DEVICE_CODENAME }}/ramdisk-recovery.img
          if-no-files-found: error
