name: Recovery Lunch Validation

on:
  push:
    branches:
      - lineage-16.0

  workflow_dispatch:

jobs:
  recovery-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt clean

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python-is-python3 \
            openjdk-11-jdk

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize LOS16 Source
        run: |
          mkdir lineage
          cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0

      - name: Create Local Manifest
        run: |
          cd lineage
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/roomservice.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

              <project
                  name="${{ github.repository }}"
                  path="device/oppo/OP4C7D-recovery"
                  remote="github"
                  revision="lineage-16.0" />

          </manifest>
          EOF

      - name: Sync Sources
        run: |
          cd lineage
          repo sync -c --no-clone-bundle --no-tags -j4

      - name: Lunch Recovery
        shell: bash
        run: |
          cd lineage
          source build/envsetup.sh
          lunch lineage_OP4C7Drecovery-eng

      - name: Build Recovery Image
        shell: bash
        run: |
          cd lineage
          source build/envsetup.sh
          lunch lineage_OP4C7Drecovery-eng
          make recoveryimage -j$(nproc)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recoveryimage
          path: lineage/out/target/product/OP4C7Drecovery/recovery.img
