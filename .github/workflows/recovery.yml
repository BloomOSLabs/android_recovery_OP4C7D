name: Build Lineage Recovery

on:
  push:
    branches:
      - lineage-16.0

  workflow_dispatch:

jobs:
  build-recovery:
    runs-on: ubuntu-22.04

    env:
      ROM_BRANCH: lineage-16.0
      DEVICE_CODENAME: OP4C7Drecovery
      OUT_DIR: out/lineage

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Aggressive Disk Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/google
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/jvm

          sudo docker system prune -af || true
          sudo apt clean || true

          df -h

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            curl \
            python2-minimal \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            openjdk-8-jdk \
            wget

          sudo update-alternatives --set java \
            /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java

          sudo update-alternatives --set javac \
            /usr/lib/jvm/java-8-openjdk-amd64/bin/javac

      - name: Fix Python Compatibility
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Install ncurses5 compatibility libraries
        run: |
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb

          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo dpkg -i libncurses5_6.3-2ubuntu0.1_amd64.deb

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global gc.auto 0

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin

          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo

          chmod a+x ~/bin/repo

          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize LineageOS Source
        run: |
          mkdir android
          cd android

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b $ROM_BRANCH \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M

      - name: Create Local Manifest
        run: |
          cd android

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/roomservice.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

              <project
                  name="${{ github.repository }}"
                  path="device/oppo/OP4C7Drecovery"
                  remote="github"
                  revision="lineage-16.0" />

          </manifest>
          EOF

      - name: Repo Sync
        run: |
          cd android

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --current-branch \
            -j4

      - name: Patch Legacy LOS16 Overlay Issue
        run: |
          cd android

          sed -i '/OverlayHostTests/d' \
            frameworks/base/core/tests/overlaytests/host/Android.mk

          sed -i '/OverlayHostTests_BadSignatureOverlay/d' \
            frameworks/base/core/tests/overlaytests/host/test-apps/SignatureOverlay/Android.mk

      - name: Setup CCache
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)

          ccache -M 5G
          ccache -o compression=true
          
      - name: Prepare Output Recovery Root
        run: |
          mkdir -p android/out/lineage/target/product/OP4C7Drecovery/recovery/root/sbin
          mkdir -p android/out/lineage/target/product/OP4C7Drecovery/recovery/root/dev
          mkdir -p android/out/lineage/target/product/OP4C7Drecovery/recovery/root/proc
          mkdir -p android/out/lineage/target/product/OP4C7Drecovery/recovery/root/sys
          mkdir -p android/out/lineage/target/product/OP4C7Drecovery/recovery/root/tmp

      - name: Build Recovery Image
        shell: bash
        run: |
          cd android

          export OUT_DIR=out/lineage
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)

          source build/envsetup.sh

          lunch lineage_OP4C7Drecovery-eng

          mka recoveryimage -j2

      - name: Verify Output
        run: |
          cd android

          ls -lh \
            out/lineage/target/product/${DEVICE_CODENAME}/

          test -f \
            out/lineage/target/product/${DEVICE_CODENAME}/recovery.img

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recoveryimage-${{ env.DEVICE_CODENAME }}
          path: |
            android/out/lineage/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
            android/out/lineage/target/product/${{ env.DEVICE_CODENAME }}/ramdisk-recovery.img
          if-no-files-found: error
